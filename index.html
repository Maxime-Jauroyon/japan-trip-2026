<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Japon · 8–29 novembre 2026</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #121821;
      --panel-2: #1a222e;
      --line: rgba(160, 175, 190, 0.22);
      --gold: #c4a574;
      --gold-2: #e0c99a;
      --ok: #6fceae;
      --mid: #e0a45a;
      --no: #7d8694;
      --cream: #e8eef6;
      --muted: #8b95a6;
      --ink: #1a222c;
      --paper: #f7f4ee;
      --accent: #8a4f36;
      --map-paper: #e8ece6;
      --map-frame: #9aa8b4;
      --panel-w: 420px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--cream);
      overflow: hidden;
    }
    .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 8px 16px; min-height: 46px;
      border-bottom: 1px solid var(--line);
      background: #0c1118;
      z-index: 20;
    }
    header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px; font-weight: 600;
      letter-spacing: 0.04em; white-space: nowrap;
    }
    .prep { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; padding: 4px 8px 4px 6px;
      border: 1px solid rgba(255,255,255,0.08); color: var(--muted);
    }
    .pill i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-block; }
    .pill.ok { color: var(--ok); border-color: rgba(111,206,174,.3); }
    .pill.ok i { background: var(--ok); border-color: var(--ok); }
    .pill.mid { color: var(--mid); border-color: rgba(224,164,90,.35); }
    .pill.mid i { background: conic-gradient(var(--mid) 180deg, transparent 0); border-color: var(--mid); }
    .pill.no { color: var(--no); }
    .pill em { color: var(--cream); font-style: normal; font-weight: 600; margin-left: 2px; }

    main { position: relative; min-height: 0; }
    #stage {
      position: absolute; inset: 0;
      background: var(--map-frame);
      overflow: hidden;
    }
    #stage::after {
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(20,28,36,0.12) 100%);
    }

    #city-list {
      position: absolute; left: 12px; top: 12px; z-index: 25;
      width: 180px; max-height: calc(100% - 24px); overflow: auto;
      padding: 8px; background: rgba(8,12,18,0.9); border: 1px solid var(--line);
      border-radius: 2px;
    }
    #city-list button {
      display: flex; align-items: center; gap: 10px; width: 100%;
      text-align: left; border: 1px solid transparent; background: transparent;
      color: var(--cream); padding: 7px 8px; margin-bottom: 3px; cursor: pointer;
      font: inherit; font-size: 13px;
    }
    #city-list button .ico {
      flex: 0 0 26px; height: 26px;
      display: grid; place-items: center;
      color: var(--gold-2);
    }
    #city-list button .ico svg { width: 24px; height: 24px; display: block; }
    #city-list button.active {
      border-color: var(--gold);
      background: rgba(196,165,116,0.1);
    }

    .home-btn, .zoom-ui {
      position: absolute; z-index: 25;
      border: 1px solid var(--line);
      background: rgba(8,12,18,.92); color: var(--cream);
      border-radius: 2px;
    }
    .home-btn {
      right: 14px; bottom: 14px;
      width: 40px; height: 40px; cursor: pointer; font-size: 18px;
    }
    .zoom-ui {
      right: 14px; bottom: 62px;
      display: flex; flex-direction: column;
    }
    .zoom-ui button {
      width: 40px; height: 36px; cursor: pointer;
      border: 0; border-bottom: 1px solid var(--line);
      background: transparent; color: var(--cream); font-size: 18px;
    }
    .zoom-ui button:last-child { border-bottom: 0; }
    .hint {
      position: absolute; left: 200px; bottom: 16px; z-index: 15;
      font-size: 11px; color: rgba(40,50,58,0.45); pointer-events: none;
      letter-spacing: 0.04em;
    }

    #country-view {
      position: absolute; inset: 0;
      overflow: hidden;
      background: #aad0dc;
    }
    #country-view.hidden { display: none; }
    .pan-viewport {
      position: absolute; inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background: #aad0dc;
    }
    .pan-viewport.dragging { cursor: grabbing; }
    .pan-world {
      position: absolute;
      left: 0; top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    .pan-world img.basemap {
      position: absolute; left: 0; top: 0;
      display: block;
      max-width: none;
      user-select: none;
      pointer-events: none;
    }
    .pan-world svg.route-layer {
      position: absolute; left: 0; top: 0;
      pointer-events: none;
      z-index: 1;
    }
    .pan-world svg.route-layer path.route-hit {
      pointer-events: stroke;
      cursor: pointer;
      fill: none;
      stroke: transparent;
      stroke-width: 28;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }
    .pan-world svg.route-layer path.route {
      pointer-events: none;
      cursor: pointer;
      fill: none;
      stroke: #8a4f36;
      stroke-width: 5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      opacity: 0.95;
    }
    .pan-world svg.route-layer path.route.hot,
    .pan-world svg.route-layer g:hover path.route { stroke: #c45c26; opacity: 1; }
    #country-marks { position: absolute; inset: 0; }
    .city-mark {
      position: absolute;
      transform: translate(-50%, -50%);
      border: 0; background: transparent; cursor: pointer;
      padding: 0; z-index: 2;
    }
    .city-mark .ico-wrap {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--paper);
      border: 2px solid #5a4a38;
      color: var(--ink);
      display: grid; place-items: center;
      box-shadow: 0 2px 10px rgba(30,40,55,0.28);
    }
    .city-mark .ico-wrap svg { width: 22px; height: 22px; display: block; }
    .city-mark:hover .ico-wrap,
    .city-mark.active .ico-wrap {
      border-color: var(--accent);
      transform: scale(1.08);
    }
    .city-mark .label {
      position: absolute;
      left: 40px; top: 50%; transform: translateY(-50%);
      white-space: nowrap;
      padding: 5px 10px;
      background: rgba(252,249,243,0.96);
      border: 1px solid rgba(90,100,112,0.3);
      color: var(--ink);
      font: 500 13px Georgia, "Times New Roman", serif;
      box-shadow: 0 2px 10px rgba(30,40,55,0.14);
      pointer-events: none;
    }
    .city-mark.label-left .label { left: auto; right: 40px; }

    #city-view {
      position: absolute; inset: 0;
      display: none;
      padding: 16px calc(var(--panel-w) + 28px) 16px 200px;
      background: var(--map-paper);
    }
    #city-view.visible { display: grid; place-items: center; }
    .city-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1100px;
      max-height: 100%;
      overflow: hidden;
      background: var(--map-paper);
      box-shadow: 0 6px 28px rgba(30,40,55,0.16);
      cursor: grab;
      touch-action: none;
    }
    .city-frame.dragging { cursor: grabbing; }
    .city-world {
      position: absolute;
      left: 0; top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    .city-world img {
      display: block;
      max-width: none;
      user-select: none;
      pointer-events: none;
    }
    .pins {
      position: absolute; left: 0; top: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .pin {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      border: 0; background: transparent; cursor: pointer;
      padding: 0;
      z-index: 2;
    }
    .pin .badge {
      width: 60px; height: 70px;
      display: grid; place-items: center;
      filter: drop-shadow(0 5px 12px rgba(0,0,0,0.5));
      transition: transform .18s ease, filter .18s ease;
    }
    .pin .badge svg { width: 60px; height: 70px; display: block; }
    .pin.dim { opacity: 0.28; filter: grayscale(0.55); z-index: 1; }
    .pin.on .badge { transform: scale(1.12); }
    .pin.selected {
      z-index: 8;
      opacity: 1;
      filter: none;
    }
    .pin.selected .badge {
      transform: scale(1.35);
      filter: drop-shadow(0 0 0 3px rgba(250,247,241,0.95)) drop-shadow(0 6px 16px rgba(196,92,38,0.55));
      animation: pinPulse 1.1s ease-in-out infinite;
    }
    @keyframes pinPulse {
      0%, 100% { transform: scale(1.32); }
      50% { transform: scale(1.42); }
    }

    .overlay {
      position: absolute; inset: 12px 12px 12px auto;
      width: min(var(--panel-w), calc(100% - 24px));
      max-height: calc(100% - 24px);
      overflow: hidden;
      display: flex; flex-direction: column;
      background: rgba(12,17,24,0.97);
      border: 1px solid var(--line);
      border-radius: 4px;
      transform: translateX(120%);
      transition: transform .25s ease;
      z-index: 30;
    }
    .overlay.open { transform: translateX(0); }
    .overlay-head {
      flex: 0 0 auto;
      display: flex; justify-content: space-between; gap: 12px;
      padding: 16px 16px 14px;
      background: #121821;
      border-bottom: 1px solid var(--line);
    }
    .overlay-head h2 { font-family: Georgia, serif; font-size: 26px; line-height: 1.1; }
    .overlay-head .jp-name {
      display: block; margin-top: 6px; color: var(--gold);
      font-size: 11px; letter-spacing: .16em;
    }
    .close {
      border: 1px solid var(--line); background: transparent; color: var(--cream);
      width: 34px; height: 34px; cursor: pointer; font-size: 18px; flex: 0 0 auto;
      border-radius: 2px;
    }
    .overlay-body {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px 16px 22px;
    }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat {
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,.05);
      padding: 10px 12px;
      border-radius: 3px;
    }
    .stat span {
      display: block; color: var(--muted); font-size: 10px;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .stat strong { display: block; margin-top: 4px; font-size: 13px; font-weight: 600; }

    .day {
      border: 1px solid rgba(255,255,255,.08);
      background: var(--panel-2);
      margin-bottom: 10px;
      border-radius: 4px;
      overflow: hidden;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .day[open] {
      border-color: rgba(196,165,116,.45);
      box-shadow: 0 0 0 1px rgba(196,165,116,.12);
    }
    .day summary {
      list-style: none; cursor: pointer; padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: rgba(255,255,255,.02);
    }
    .day summary::-webkit-details-marker { display: none; }
    .day summary::after {
      content: "▸";
      color: var(--muted);
      font-size: 11px;
      transition: transform .15s ease;
    }
    .day[open] summary::after { transform: rotate(90deg); color: var(--gold); }
    .day-title { font-size: 13px; font-weight: 600; }
    .day-date { color: var(--gold); font-size: 12px; white-space: nowrap; }
    .slot { padding: 0 14px 14px; }
    .slot h4 {
      color: var(--gold); font-size: 10px; letter-spacing: .14em;
      text-transform: uppercase; margin: 12px 0 8px;
    }
    .act {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 9px 8px;
      margin: 0 -8px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      font-size: 13px;
      cursor: pointer;
      border-radius: 3px;
      transition: background .12s ease;
    }
    .act:hover { background: rgba(196,165,116,.08); }
    .act .dot {
      width: 7px; height: 7px; margin-top: 6px; flex: 0 0 7px;
      border-radius: 50%; background: var(--gold);
    }
    .act .act-title { font-weight: 500; }
    .move {
      margin-top: 8px; padding: 11px 12px;
      border: 1px dashed var(--line);
      cursor: pointer;
      border-radius: 3px;
      transition: background .12s ease, border-color .12s ease;
    }
    .move:hover { background: rgba(196,165,116,.06); border-color: var(--gold); }
    .move .when { color: var(--gold-2); font-size: 12px; }
    .move .title { margin-top: 3px; font-weight: 500; }
    .move .dummy { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .note { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .badge-tag {
      display: inline-block; font-size: 10px; padding: 3px 8px;
      border: 1px solid var(--line); color: var(--gold-2); margin-bottom: 8px;
      border-radius: 2px; letter-spacing: .04em;
    }
    .status {
      display: inline-block; font-size: 10px; padding: 2px 8px;
      border-radius: 999px; letter-spacing: .04em; font-weight: 600;
      text-transform: uppercase;
    }
    .status.placeholder { background: rgba(125,134,148,.2); color: var(--no); }
    .status.reserved { background: rgba(224,164,90,.18); color: var(--mid); }
    .status.paid { background: rgba(111,206,174,.18); color: var(--ok); }

    .stay-block {
      margin-bottom: 18px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .stay-block:last-of-type { border-bottom: 0; }
    .stay-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
      margin-bottom: 10px;
    }
    .stay-head h3 {
      font-family: Georgia, serif; font-size: 17px; font-weight: 600;
    }
    .stay-head .stay-dates { color: var(--muted); font-size: 12px; }

    .hotel-card {
      display: grid; grid-template-columns: 72px 1fr;
      gap: 12px; padding: 12px;
      width: 100%; text-align: left; font: inherit; color: inherit;
      background: var(--panel-2);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: border-color .15s ease, background .15s ease;
    }
    .hotel-card:hover { border-color: rgba(196,165,116,.45); background: rgba(196,165,116,.06); }
    .hotel-card .thumb {
      width: 72px; height: 72px; border-radius: 4px;
      background: linear-gradient(145deg, #3a4555, #1e2632);
      display: grid; place-items: center;
      color: var(--gold-2);
    }
    .hotel-card .thumb svg { width: 28px; height: 28px; }
    .hotel-card .meta { min-width: 0; }
    .hotel-card .name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .hotel-card .row { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .hotel-card .row em { color: var(--cream); font-style: normal; }

    .trajet-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
    }
    .trajet-grid .stat.wide { grid-column: 1 / -1; }

    .detail-sheet .pill-row,
    .overlay-body > .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .detail-kv {
      display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px;
      margin: 12px 0; font-size: 13px;
    }
    .detail-kv dt { color: var(--muted); }
    .detail-kv dd { color: var(--cream); }

    .sheet-kind {
      display: inline-block; font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--gold-2);
      border: 1px solid rgba(196,165,116,.35);
      padding: 3px 9px; border-radius: 2px; margin-bottom: 10px;
    }
    .sheet-kind.hotel { color: #d4b896; border-color: rgba(212,184,150,.4); }
    .sheet-kind.activity { color: #9ec5b8; border-color: rgba(158,197,184,.4); }
    .sheet-kind.trajet { color: #c4a574; border-color: rgba(196,165,116,.4); }
    .detail-sheet h3 { font-family: Georgia, serif; font-size: 22px; margin: 0 0 8px; }
    .detail-notes { margin: 10px 0 0; padding: 0; list-style: none; }
    .detail-notes li {
      position: relative; padding: 6px 0 6px 14px;
      color: var(--muted); font-size: 13px; line-height: 1.45;
      border-top: 1px solid rgba(255,255,255,.05);
    }
    .detail-notes li::before {
      content: ""; position: absolute; left: 0; top: 13px;
      width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
    }

    .detail-sheet { display: none; }
    .detail-sheet.show { display: block; }
    .detail-back {
      display: inline-flex; align-items: center; gap: 6px;
      border: 0; background: transparent; color: var(--gold-2);
      cursor: pointer; font: inherit; font-size: 13px;
      margin-bottom: 14px; padding: 0;
    }
    .detail-back:hover { color: var(--cream); }
    .detail-hero {
      width: 100%; aspect-ratio: 16 / 10;
      border-radius: 4px; overflow: hidden;
      background: linear-gradient(145deg, #2a3340, #1a222e);
      margin-bottom: 12px;
      position: relative;
    }
    .detail-hero img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .detail-hero .ph {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      color: var(--gold-2);
    }
    .detail-hero .ph svg { width: 48px; height: 56px; opacity: .85; }
    .photo-gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }
    .photo-gallery .shot {
      aspect-ratio: 4 / 3;
      border-radius: 4px;
      overflow: hidden;
      background: #1a222e;
    }
    .photo-gallery .shot.wide {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 9;
    }
    .photo-gallery .shot img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .detail-sheet h3 {
      font-family: Georgia, serif;
      font-size: 22px; line-height: 1.2; margin-bottom: 10px;
    }
    .detail-sheet .desc {
      color: var(--muted); font-size: 14px; line-height: 1.6;
    }

    .sheet-grab {
      display: none;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 16px 4px;
      cursor: pointer;
      flex: 0 0 auto;
      touch-action: manipulation;
    }
    .sheet-grab .sheet-bar {
      display: block;
      width: 42px; height: 4px;
      margin: 0 auto 6px;
      border-radius: 99px;
      background: rgba(255,255,255,.28);
    }
    .sheet-grab .sheet-chevron {
      display: block;
      font-size: 14px;
      line-height: 1;
      transition: transform .2s ease;
    }
    .overlay.expanded .sheet-grab .sheet-chevron { transform: rotate(180deg); }

    .city-banner {
      display: none;
      position: absolute;
      left: 50%; top: 12px;
      transform: translateX(-50%);
      z-index: 26;
      pointer-events: none;
      padding: 8px 14px;
      background: rgba(8,12,18,.88);
      border: 1px solid var(--line);
      border-radius: 999px;
      font: 600 14px Georgia, "Times New Roman", serif;
      color: var(--cream);
      white-space: nowrap;
      max-width: calc(100% - 120px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 900px) {
      header {
        padding: 6px 12px;
        min-height: 40px;
        gap: 10px;
      }
      header h1 { font-size: 15px; }
      .prep { gap: 4px; }
      .pill { font-size: 10px; padding: 3px 6px 3px 5px; }
      .pill em { display: none; }

      /* Vue ville : plus de place pour la carte */
      .app.city-mode header,
      .app.city-mode #city-list { display: none !important; }
      .app.city-mode .city-banner { display: block; }
      .app.city-mode .home-btn {
        left: 12px; right: auto;
        top: 12px; bottom: auto;
      }
      .app.city-mode .zoom-ui {
        right: 12px;
        top: 12px; bottom: auto;
      }

      #city-view {
        padding: 0;
        place-items: stretch;
      }
      .city-frame {
        max-width: none;
        box-shadow: none;
        border-radius: 0;
      }

      .overlay {
        inset: auto 0 0 0;
        width: 100%;
        max-height: 38vh;
        transform: translateY(110%);
        border-radius: 14px 14px 0 0;
        border-left: 0; border-right: 0; border-bottom: 0;
        transition: transform .25s ease, max-height .28s ease;
      }
      .overlay.open { transform: translateY(0); }
      .overlay.open.expanded { max-height: 88vh; }
      .sheet-grab { display: block; }
      .overlay-head {
        padding: 4px 16px 12px;
        align-items: flex-start;
      }
      .overlay-head h2 { font-size: 22px; }
      .overlay-body { padding: 10px 16px 28px; -webkit-overflow-scrolling: touch; }

      #city-list {
        display: flex; width: auto; max-width: calc(100% - 24px);
        overflow-x: auto; right: 12px; left: 12px;
        top: 8px; max-height: none;
        -webkit-overflow-scrolling: touch;
        gap: 2px;
      }
      #city-list button { flex: 0 0 auto; width: auto; margin-bottom: 0; }
      .hint { display: none; }

      /* Pastilles pays plus faciles à viser / lire */
      .city-mark .ico-wrap {
        width: 44px; height: 44px;
        border-width: 2.5px;
      }
      .city-mark .ico-wrap svg { width: 26px; height: 26px; }

    function daysForCity(id){
      // Include any day that belongs to the city OR has an arrive/depart leg for it
      const map = new Map();
      DAYS.forEach(d => {
        const cityDay = d.city === id || d.extraCity === id;
        const moves = movesForCity(d.moves, id);
        if (!cityDay && !moves.length) return;
        map.set(d.n, Object.assign({}, d, {
          moves,
          // Ideas only when this is actually a stay/visit day for the city
          ideas: cityDay ? d.ideas : [],
          ideasAfter: cityDay ? d.ideasAfter : []
        }));
      });
      return [...map.values()].sort((a, b) => a.n - b.n);
    }

    function legCityId(point){
      if (!point) return null;
      if (point.id) return point.id;

      return null;

    function movesForCity(moves, cityId){
      return (moves || []).filter(m => {
        if (!m.leg) return true;
        const leg = LEGS.find(l => l.id === m.leg);
        if (!leg) return true;
        return legCityId(leg.from) === cityId || legCityId(leg.to) === cityId;
      }).map(m => {
        const leg = m.leg ? LEGS.find(l => l.id === m.leg) : null;
        let role = "";
        if (leg){
          if (legCityId(leg.to) === cityId) role = "arrivée";
          else if (legCityId(leg.from) === cityId) role = "départ";
        }
        return Object.assign({}, m, { role });
      });
    }

    function inBounds(b, lat, lng){

      DAYS.forEach(d => {

          if (a.lat == null || a.lng == null) return;
          if (!inBounds(b, a.lat, a.lng)) return;
          const key = a.lat.toFixed(4) + "," + a.lng.toFixed(4);
          if (seen.has(key)) return;
          seen.add(key);
          pts.push(a);
        });
      });
      return pts;
    }

        else st.x = Math.min(0, Math.max(vw - ww, st.x));
        if (wh <= vh) st.y = (vh - wh) / 2;
        else st.y = Math.min(0, Math.max(vh - wh, st.y));
      }
      function zoomAt(cx, cy, factor){
        const min = minScale();
        const ns = Math.min(o.max, Math.max(min, st.s * factor));
        const k = ns / st.s;
        st.x = cx - (cx - st.x) * k;
        st.y = cy - (cy - st.y) * k;
        st.s = ns;
        clamp(); apply();
      }
      function fitCover(extra){
        extra = extra == null ? 1 : extra;
        const min = minScale();
        st.s = Math.min(o.max, min * extra);
        st.x = (viewport.clientWidth - world.offsetWidth * st.s) / 2;
        st.y = (viewport.clientHeight - world.offsetHeight * st.s) / 2;
        clamp(); apply();
      }
      function focusPct(leftPct, topPct, s){
        const vw = viewport.clientWidth, vh = viewport.clientHeight;
        const min = minScale();
        st.s = Math.min(o.max, Math.max(min, s));
        st.x = vw / 2 - (leftPct / 100) * world.offsetWidth * st.s;
        st.y = vh / 2 - (topPct / 100) * world.offsetHeight * st.s;
        clamp(); apply();
      }
      function pinchMetrics(){
        const arr = [...pointers.values()];
        if (arr.length < 2) return null;
        const a = arr[0], b = arr[1];
        return {
          dist: Math.hypot(b.x - a.x, b.y - a.y) || 1,
          cx: (a.x + b.x) / 2,
          cy: (a.y + b.y) / 2
        };
      }
      function isMapChrome(el){
        return !!(el && el.closest && el.closest("button, path.route-hit, path.route, .pin, .sheet-grab, .overlay"));
      }
      viewport.addEventListener("wheel", e => {
        e.preventDefault();
        const r = viewport.getBoundingClientRect();
        zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
      }, { passive:false });
      viewport.addEventListener("pointerdown", e => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        if (isMapChrome(e.target)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        try { viewport.setPointerCapture(e.pointerId); } catch (_) {}
        if (pointers.size >= 2) {
          st.drag = false;
          viewport.classList.remove("dragging");
          const p = pinchMetrics();
          if (p) pinch0 = { dist: p.dist, s: st.s };
        } else {
          st.drag = true; st.lx = e.clientX; st.ly = e.clientY;
          viewport.classList.add("dragging");
        }
      });
      viewport.addEventListener("pointermove", e => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size >= 2 && pinch0) {
          const p = pinchMetrics();
          if (!p) return;
          const r = viewport.getBoundingClientRect();
          const cx = p.cx - r.left, cy = p.cy - r.top;
          const min = minScale();
          const ns = Math.min(o.max, Math.max(min, pinch0.s * (p.dist / pinch0.dist)));
          const k = ns / st.s;
          st.x = cx - (cx - st.x) * k;
          st.y = cy - (cy - st.y) * k;
          st.s = ns;
          clamp(); apply();
          return;
        }
        if (!st.drag) return;
        st.x += e.clientX - st.lx;
        st.y += e.clientY - st.ly;
        st.lx = e.clientX; st.ly = e.clientY;
        clamp(); apply();
      });
      function endPointer(e){
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);
        try { viewport.releasePointerCapture(e.pointerId); } catch (_) {}
        if (pointers.size < 2) pinch0 = null;
        if (pointers.size === 0) {
          st.drag = false;
          viewport.classList.remove("dragging");
        } else if (pointers.size === 1) {
          const only = [...pointers.values()][0];
          st.drag = true;
          st.lx = only.x; st.ly = only.y;
          viewport.classList.add("dragging");
        }
      }
      viewport.addEventListener("pointerup", endPointer);
      viewport.addEventListener("pointercancel", endPointer);
      return {
        state:st, apply, clamp, zoomAt, fitCover, focusPct, minScale,
        zoomIn(){ zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1.2); },
        zoomOut(){ zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1/1.2); }
      };
    }

    function routePathD(leg){
      const pts = [leg.from, ...(leg.via || []), leg.to].map(p => projectJapan(p.lat, p.lng));
      if (pts.length < 2) return "";
      const f = p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
      if (pts.length === 2){
        const a = pts[0], b = pts[1];
        const mx = (a.x + b.x) / 2 + (b.y - a.y) * 0.08;
        const my = (a.y + b.y) / 2 - (b.x - a.x) * 0.08;
        return `M${f(a)} Q${mx.toFixed(1)},${my.toFixed(1)} ${f(b)}`;
      }
      // Smooth polyline through waypoints (avoids other cities, e.g. Osaka→Tokyo south of Fuji)
      let d = `M${f(pts[0])}`;
      for (let i = 1; i < pts.length - 1; i++){
        const midX = (pts[i].x + pts[i + 1].x) / 2;
        const midY = (pts[i].y + pts[i + 1].y) / 2;
        d += ` Q${f(pts[i])} ${midX.toFixed(1)},${midY.toFixed(1)}`;
      }
      const last = pts[pts.length - 1], prev = pts[pts.length - 2];
      d += ` Q${f(prev)} ${f(last)}`;
      return d;
    }

    function buildCountry(){
      const routes = document.getElementById("routes");
      routes.innerHTML = "";

        if (leg.skipMap) return;
        const d = routePathD(leg);
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.dataset.leg = leg.id;
        const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
        hit.setAttribute("d", d);
        hit.setAttribute("class", "route-hit");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("class", "route");
        path.dataset.leg = leg.id;
        const open = e => { e.stopPropagation(); openLeg(leg.id); };
        hit.addEventListener("click", open);
        hit.addEventListener("mouseenter", () => path.classList.add("hot"));
        hit.addEventListener("mouseleave", () => path.classList.remove("hot"));
        g.appendChild(hit);
        g.appendChild(path);
        routes.appendChild(g);
      });

      const marks = document.getElementById("country-marks");
      marks.innerHTML = "";
      ORDER.forEach(id => {
        const c = CITIES[id];

    function renderCityPins(id, day, selected){
      const places = placesOnMap(id);
      const dayKeys = new Set();

        ideasOf(day).forEach(a => {
          if (a.lat == null) return;
          dayKeys.add(a.lat.toFixed(4) + "," + a.lng.toFixed(4));
        });
      }
      const selKey = selected && selected.lat != null
        ? selected.lat.toFixed(4) + "," + selected.lng.toFixed(4)
        : null;
      cityPins.innerHTML = "";
      places.forEach(a => {
        const key = a.lat.toFixed(4) + "," + a.lng.toFixed(4);
        const onDay = !day || dayKeys.has(key);

        [/ōmichō|omicho|ōmicho/, "omicho"], [/oyama/, "oyama"], [/xxie|21st|musée du xxi/, "kanazawa-museum"],
        [/nishi chaya/, "nishi-chaya"], [/nagamachi|samoura/, "nagamachi"], [/feuille d[’']or|gold leaf/, "gold-leaf"],
        [/myōryū|myoryu|ninja/, "myoryuji"], [/teramachi/, "teramachi"], [/miyagawa/, "miyagawa"],

    function photosFor(act){
      const out = [];
      const seen = new Set();
      const push = src => {
        if (!src || seen.has(src)) return;
        seen.add(src);
        out.push(src);
      };
      if (act.photo) push(act.photo);
      (act.photos || []).forEach(push);
      if (act.img) push(act.img);
      const slug = photoSlug(act);
      if (slug){
        push("./img/activities/" + slug + ".jpg");
        push("./img/activities/" + slug + "-2.jpg");
        push("./img/activities/" + slug + "-3.jpg");
        // related fallbacks from same city vibe
        const related = {
          akihabara: ["shinjuku","shibuya"], shinjuku: ["shibuya","tokyo-tower"], sensoji: ["ueno","yanaka"],
          ueno: ["sensoji","yanaka"], meiji: ["harajuku","shibuya"], harajuku: ["meiji","shibuya"],
          shibuya: ["harajuku","shinjuku"], odaiba: ["tokyo-tower","teamlab"], teamlab: ["odaiba","tokyo-tower"],
          "tokyo-tower": ["odaiba","shinjuku"], chureito: ["kawaguchi","oshino"], kawaguchi: ["chureito","ropeway"],
          kenrokuen: ["kanazawa-castle","higashi-chaya"], "kanazawa-castle": ["kenrokuen","omicho"],
          shirakawa: ["sanmachi"], sanmachi: ["shirakawa","miyagawa"], kiyomizu: ["yasaka","fushimi"],
          arashiyama: ["kinkakuji","philosopher"], kinkakuji: ["arashiyama","nijo"], fushimi: ["kiyomizu","daigo"],
          nijo: ["nishiki","philosopher"], "nara-park": ["todaiji","kasuga"], todaiji: ["nara-park","kofukuji"],
          dotonbori: ["osaka-castle","shinsaibashi"], usj: ["dotonbori"], "osaka-castle": ["dotonbori","kuromon"]
        };
        (related[slug] || []).forEach(r => {
          push("./img/activities/" + r + ".jpg");
          push("./img/activities/" + r + "-2.jpg");
        });
      }
      return out.slice(0, 5);
    }

      }
      const kind = pinKind(act.title);
      const gallery = renderPhotoGallery(photosFor(act), kind);
      showDetailSheet(
        `<span class="sheet-kind activity">Activité</span>` +
        `<h3>${esc(act.title)}</h3>` +
        `<p class="desc">${esc(act.desc || "")}</p>` +
        gallery
      );
      highlightPin(act);
    }

    function openHotelDetail(stay){
      if (!panelContext || panelContext.type !== "city") return;
      const h = stay.hotel || {};
      const notes = (h.notes || []).map(n => `<li>${esc(n)}</li>`).join("");
      showDetailSheet(
        `<span class="sheet-kind hotel">Hôtel</span>` +
        `<div class="detail-hero"><div class="ph">${hotelIconSvg()}</div></div>` +
        `<h3>${esc(h.name || "Hôtel à définir")}</h3>` +
        `<p class="desc">${esc(h.desc || "")}</p>` +
        `<div class="pill-row"><span class="status ${statusClass(h.status)}">${statusLabel(h.status)}</span></div>` +
        `<dl class="detail-kv">` +
        `<dt>Séjour</dt><dd>${esc(stay.label || "")}</dd>` +
        `<dt>Dates</dt><dd>${esc(stay.from)} → ${esc(stay.to)} · ${esc(stay.nights)}</dd>` +
        `<dt>Quartier</dt><dd>${esc(h.area || "—")}</dd>` +
        `<dt>Adresse</dt><dd>${esc(h.address || "—")}</dd>` +
        `<dt>Arrivée</dt><dd>${esc(h.checkIn || "—")}</dd>` +
        `<dt>Départ</dt><dd>${esc(h.checkOut || "—")}</dd>` +
        `<dt>Paiement</dt><dd>${esc(h.payment || "—")}</dd>` +
        `<dt>Prix</dt><dd>${esc(h.price || "—")}</dd>` +
        `</dl>` +
        (notes ? `<ul class="detail-notes">${notes}</ul>` : "")
      );
    }

    function bindPanel(days, cityId){
      days = days || [];
      cityId = cityId || (panelContext && panelContext.city && panelContext.city.id);
      panel.querySelector(".close").onclick = () => closePanel(true);
      panel.querySelectorAll(".move[data-leg]").forEach(n =>
        n.addEventListener("click", () => openLeg(n.dataset.leg))
      );
      panel.querySelectorAll(".hotel-card[data-stay]").forEach(n => {
        n.addEventListener("click", () => {
          const stay = (panelContext.city.stays || []).find(s => s.id === n.dataset.stay);
          if (stay) openHotelDetail(stay);
        });
      });
      panel.querySelectorAll("details.day").forEach((el) => {
        const dayN = Number(el.dataset.dayN);
        const day = days.find(d => d.n === dayN) || days[0];
        const filtered = [].concat(
          ideasForCity(day && day.ideas, cityId),
          ideasForCity(day && day.ideasAfter, cityId)
        );
        el.querySelectorAll(".act").forEach(node => {
          const idx = Number(node.dataset.actIdx);
          const act = filtered[idx];
          if (!act) return;
          const open = () => openActivityDetail(act);
          node.addEventListener("click", open);
          node.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
        });
        el.addEventListener("toggle", () => {
          if (!currentCity) return;
          if (el.open && day){
            showCity(currentCity, day.n);
            panel.querySelectorAll("details.day").forEach(o => { if (o !== el) o.open = false; });
          } else if (![...panel.querySelectorAll("details.day")].some(d => d.open)){
            showCity(currentCity, null);
          }
        });
      });
    }

    function sheetGrabHtml(){
      return `<button type="button" class="sheet-grab" aria-label="Agrandir ou réduire le panneau" aria-expanded="false"><span class="sheet-bar"></span><span class="sheet-chevron">▴</span></button>`;
    }
    function bindSheetGrab(){
      panel.classList.remove("expanded");
      const grab = panel.querySelector(".sheet-grab");
      if (!grab) return;
      grab.setAttribute("aria-expanded", "false");
      grab.onclick = () => {
        const on = panel.classList.toggle("expanded");
        grab.setAttribute("aria-expanded", on ? "true" : "false");
        // Recentrer la carte ville quand le sheet change de taille
        if (currentCity) requestAnimationFrame(() => fitCityMap());
      };
    }

    function fillCityPanel(c, days, openN){
      panelContext = { type:"city", city:c, days };
      const groups = stayGroups(c, days);
      const staysHtml = groups.map(({ stay, days: stayDays }) => {
        const cards = stayDays.map(d => {
          const moves = d.moves || [];
          const ideas = ideasForCity(d.ideas, c.id);
          const ideasAfter = ideasForCity(d.ideasAfter, c.id);
          let body = "";
          if (moves.length) body += renderMoves(moves);
          if (ideas.length) body += `<h4>Idées</h4>${renderIdeas(ideas, 0)}`;
          if (ideasAfter.length) body += `<h4>Après l’arrivée</h4>${renderIdeas(ideasAfter, ideas.length)}`;
          if (!body) body = `<p class="note">Rien de prévu ce jour-là pour cette ville.</p>`;
          return `<details class="day" data-day-n="${d.n}"${d.n === openN ? " open" : ""}><summary><span class="day-title">Jour ${d.n} · ${esc(d.dow)}</span><span class="day-date">${esc(d.date)}</span></summary><div class="slot">${body}</div></details>`;
        }).join("");
        return `<section class="stay-block">
          <div class="stay-head"><h3>${esc(stay.label)}</h3><span class="stay-dates">${esc(stay.from)} → ${esc(stay.to)}</span></div>
          ${renderHotelCard(stay)}
          ${cards}
        </section>`;
      }).join("");

      panel.innerHTML =
        sheetGrabHtml() +
        `<div class="overlay-head"><div><h2>${esc(c.name)}</h2><span class="jp-name">${esc(c.jp)} · ville verrouillée</span></div><button class="close" type="button" aria-label="Fermer">×</button></div>` +
        `<div class="overlay-body"><div class="city-panel">${staysHtml}</div><div class="detail-sheet"></div></div>`;
      panel.classList.add("open");
      bindSheetGrab();
      bindPanel(days, c.id);
    }

    function closePanel(reset){
      if (reset === undefined) reset = true;
      panel.classList.remove("open", "expanded");
      panelContext = null;
      setActiveCity(null);
      if (reset) goOverview();
    }
    function goOverview(){
      panel.classList.remove("open", "expanded");
      panelContext = null;
      document.querySelectorAll("#routes path.route").forEach(p => {
        p.style.stroke = "";
        p.style.strokeWidth = "";
        p.style.opacity = "";
      });
      showCountry();
    }
    function openCity(id){
      showCity(id, null);
      fillCityPanel(CITIES[id], daysForCity(id), null);
    }
    function openLeg(id){
      const leg = LEGS.find(l => l.id === id);
      panelContext = { type:"leg", leg };
      showCountry();
      document.querySelectorAll("#routes path.route").forEach(p => {
        const on = p.dataset.leg === id;
        p.style.stroke = on ? "#c45c26" : "#6e5a48";
        p.style.strokeWidth = on ? "6" : "4";
        p.style.opacity = on ? "1" : "0.35";
      });
      document.querySelectorAll("#routes path.route-hit").forEach(p => {
        p.style.pointerEvents = "";
      });
      setActiveCity(null);
      const tips = leg.tips ? `<p class="note" style="color:var(--gold-2)">${esc(leg.tips)}</p>` : "";
      const details = (leg.details || []).map(d => `<li>${esc(d)}</li>`).join("");
      panel.innerHTML =
        sheetGrabHtml() +
        `<div class="overlay-head"><div><h2>${esc(leg.title)}</h2><span class="jp-name">${esc(leg.subtitle)}</span></div><button class="close" type="button" aria-label="Fermer">×</button></div>` +
        `<div class="overlay-body">` +
        `<span class="sheet-kind trajet">Trajet</span>` +
        `<div class="pill-row"><span class="status ${statusClass(leg.status)}">${statusLabel(leg.status)}</span></div>` +
        `<div class="trajet-grid">` +
        `<div class="stat"><span>Départ</span><strong>${esc(leg.depart || "—")}</strong></div>` +
        `<div class="stat"><span>Arrivée</span><strong>${esc(leg.arrive || "—")}</strong></div>` +
        `<div class="stat"><span>Mode</span><strong>${esc(leg.mode)}</strong></div>` +
        `<div class="stat"><span>Durée</span><strong>${esc(leg.duration || "—")}</strong></div>` +
        `<div class="stat wide"><span>Compagnie</span><strong>${esc(leg.operator || "—")}</strong></div>` +
        `</div>` +
        `<dl class="detail-kv">` +
        `<dt>Place</dt><dd>${esc(leg.seat || "—")}</dd>` +
        `<dt>Réf. résa</dt><dd>${esc(leg.ref || "—")}</dd>` +
        `<dt>Paiement</dt><dd>${esc(leg.payment || "—")}</dd>` +
        `<dt>Prix</dt><dd>${esc(leg.price || "—")}</dd>` +
        `</dl>` +
        (details ? `<ul class="detail-notes">${details}</ul>` : "") +
        tips +
        `</div>`;
      panel.classList.add("open");
      bindSheetGrab();
      panel.querySelector(".close").onclick = () => closePanel(true);
      const via = leg.via || [];
      const mid = via.length
        ? via[Math.floor(via.length / 2)]
        : { lat: (leg.from.lat + leg.to.lat) / 2, lng: (leg.from.lng + leg.to.lng) / 2 };
      const pct = pctIn(JAPAN_BOUNDS, mid.lat, mid.lng);
      requestAnimationFrame(() => {
        sizeJapanWorld();
        countryCam.focusPct(pct.left, pct.top, Math.max(countryCam.minScale() * 1.6, 2.0));
      });
    }

    ORDER.forEach(id => {
      const c = CITIES[id];
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.city = id;
      b.innerHTML = `<span class="ico">${cityIconSvg(id)}</span><span><strong>${c.name}</strong></span>`;
      b.addEventListener("click", () => openCity(id));
      cityList.appendChild(b);
    });

    document.getElementById("z-home").onclick = () => closePanel(true);
    document.getElementById("z-in").onclick = () => {
      if (countryView.classList.contains("hidden")) cityCam.zoomIn();
      else countryCam.zoomIn();
    };
    document.getElementById("z-out").onclick = () => {
      if (countryView.classList.contains("hidden")) cityCam.zoomOut();
      else countryCam.zoomOut();
    };
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closePanel(true);
    });
    window.addEventListener("resize", () => {
      if (currentCity) fitCityMap();
      else {
        sizeJapanWorld();
        countryCam.fitCover(1.02);
      }
    });

    function bootCountry(){
      sizeJapanWorld();
      buildCountry();
      showCountry();
    }
    if (japanImg.complete && japanImg.naturalWidth) bootCountry();
    else japanImg.onload = bootCountry;
  </script>
  <script>
    // Cache le site pour Safari hors ligne (après 1ère ouverture avec Wi‑Fi)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
