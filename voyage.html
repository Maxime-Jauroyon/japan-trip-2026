<!DOCTYPE html>

  <title>Notre voyage au Japon</title>

    (function () {
      var dark = true;
      try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="icon" href="./img/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./img/icon-180.png" />

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--cream); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.vy-wrap { max-width: 640px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  </style>
</head>
